<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Navya 🎂</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; overflow-x:hidden; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
 background:radial-gradient(circle at top,#ffd6ef,#8b5cf6 45%,#160b2e 100%);
 color:white; text-align:center;
}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{
 width:min(520px,94vw); padding:28px 20px; border-radius:28px;
 background:rgba(255,255,255,.13); backdrop-filter:blur(12px);
 box-shadow:0 20px 60px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25)
}
h1{font-size:clamp(34px,9vw,58px);margin:8px 0 4px}
h2{font-size:24px;margin:4px 0 18px}
p{opacity:.92;line-height:1.55}
button{
 border:0;border-radius:999px;padding:14px 22px;font-size:16px;font-weight:700;
 background:white;color:#7c3aed;cursor:pointer;margin:8px;box-shadow:0 8px 25px rgba(0,0,0,.2)
}
.hidden{display:none}
.cake-area{position:relative;height:260px;display:flex;align-items:center;justify-content:center}
.cake{position:relative;width:210px;height:125px;margin-top:55px}
.layer{position:absolute;left:10px;width:190px;height:48px;border-radius:14px;background:#ff9fcf;box-shadow:inset 0 -8px rgba(255,255,255,.2)}
.layer.one{bottom:0} .layer.two{bottom:42px;width:175px;left:18px;background:#ffd1e7}
.cream{position:absolute;bottom:80px;left:28px;width:155px;height:22px;border-radius:50%;background:white}
.candle{position:absolute;bottom:101px;left:96px;width:18px;height:45px;border-radius:5px;background:#fff}
.flame{position:absolute;bottom:143px;left:99px;width:14px;height:22px;border-radius:50% 50% 50% 10%;background:#ffd43b;transform:rotate(45deg);box-shadow:0 0 22px #ffd43b}
.cut .layer.one{clip-path:polygon(0 0,48% 0,54% 100%,0 100%)}
.cut .layer.two{clip-path:polygon(0 0,48% 0,54% 100%,0 100%)}
.cut .candle,.cut .flame{opacity:.15}
.photos{position:relative;height:330px;overflow:hidden;border-radius:22px;margin-top:20px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s}
.slide.active{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.dots{margin-top:10px;letter-spacing:5px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;animation:fall 3.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.message{font-size:18px;margin:18px 4px}
.small{font-size:13px;opacity:.7}
</style>
</head>
